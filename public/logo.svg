<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Antariksham</title>
  <!--
    Standalone brand asset, served from /logo.svg.

    Used as the Organization `logo` in the JSON-LD emitted on every article
    (modules/articles/services/articleMetadata.ts) and available for any external
    consumer — press, partners, aggregators — that needs a file rather than
    markup. Colours are baked for the same reason as app/icon.svg: nothing
    fetching this URL can read the site's CSS variables.

    For in-page use always prefer <Logo> / <LogoMark> from components/brand/Logo.tsx,
    which inherit the theme instead.
  -->
